<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Riviera has a new home</title>
<meta name="description" content="Riviera now lives at rivieraapp.github.io.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://rivieraapp.github.io/">
<meta http-equiv="refresh" content="0; url=https://rivieraapp.github.io/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#fbfbfd; --text:#1d1d1f; --muted:#636368; --link:#0062c4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0d; --text:#f5f5f7; --muted:#a3a3a9; --link:#5eb0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:560px; margin:0 auto; padding:96px 20px; text-align:center; }
  img { width:84px; height:84px; border-radius:22.37%; }
  h1 { margin:20px 0 8px; font-size:30px; letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); }
  a { color:var(--link); }
</style>
</head>
<body>
<main>
  <img src="/riviera/img/icon-180.png" width="84" height="84" alt="">
  <h1>Riviera has a new home.</h1>
  <p>Taking you to <a href="https://rivieraapp.github.io/">rivieraapp.github.io</a>.</p>
</main>
<script>location.replace('https://rivieraapp.github.io/' + location.hash);</script>
</body>
</html>
